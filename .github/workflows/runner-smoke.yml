name: runner-smoke

on:
  workflow_dispatch:
  # workflow_dispatch only works once this file is on the default branch;
  # push trigger lets the smoke test run from the feature branch too.
  push:
    branches: [github-runners]

jobs:
  smoke:
    runs-on: k3s
    steps:
      - uses: actions/checkout@v4
      - name: prove runner + dind work
        run: |
          echo "runner: $(hostname)"
          uname -a
          docker info --format 'docker server: {{.ServerVersion}}'
