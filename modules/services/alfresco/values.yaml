# Community profile from ACS chart 10.8.0, adapted for kin's existing Traefik.
# https://alfresco.github.io/acs-deployment/docs/helm/desktop-deployment.html
# ponytail: single-instance test deployment, not HA; add backup/HA before real data.
global:
  known_urls:
    - http://alfresco.local
  ingressClassName: traefik
alfresco-repository:
  autoscaling:
    enabled: false
  replicaCount: 1
  image:
    repository: alfresco/alfresco-content-repository-community
    tag: 26.2.0
  strategy:
    type: Recreate
    rollingUpdate: null
  persistence:
    storageClass: longhorn
    accessModes: [ReadWriteOnce]
    baseSize: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: '4'
      memory: 4Gi
  startupProbe:
    failureThreshold: 30
  configuration:
    repository:
      existingSecrets:
        - name: alfresco-admin
          key: ADMIN_PASSWORD_HASH
          purpose: property:alfresco_user_store.adminpassword
    search:
      flavor: elasticsearch
      existingSecret:
        keys:
          solr-secret: SOLR_SECRET
  ingress:
    annotations: {}
    hosts:
      - host: alfresco.local
        paths:
          - path: /alfresco
            pathType: Prefix
          - path: /api-explorer
            pathType: Prefix
          - path: /alfresco/s/prometheus
            pathType: Prefix
            serviceName: blocked-prometheus
activemq:
  image:
    repository: docker.io/alfresco/alfresco-activemq
    tag: 6.2.9-jre17-rockylinux8
share:
  image:
    repository: alfresco/alfresco-share
    tag: 26.2.2
  # Share's login probe waits on the repository during first-time DB setup.
  livenessProbe:
    initialDelaySeconds: 300
    timeoutSeconds: 10
  ingress:
    annotations: {}
    hosts:
      - host: alfresco.local
        paths:
          - path: /share
            pathType: Prefix
alfresco-search-enterprise:
  enabled: false
alfresco-search:
  enabled: false
alfresco-search-community:
  enabled: true
  image:
    tag: 5.8.0
alfresco-transform-service:
  enabled: true
  transformrouter:
    enabled: false
  pdfrenderer:
    replicaCount: 1
    image:
      repository: alfresco/alfresco-pdf-renderer
  imagemagick:
    replicaCount: 1
    image:
      repository: alfresco/alfresco-imagemagick
  libreoffice:
    replicaCount: 1
    image:
      repository: alfresco/alfresco-libreoffice
  tika:
    replicaCount: 1
    image:
      repository: alfresco/alfresco-tika
  transformmisc:
    replicaCount: 1
    image:
      repository: alfresco/alfresco-transform-misc
  filestore:
    enabled: false
alfresco-control-center:
  enabled: false
alfresco-digital-workspace:
  enabled: false
alfresco-sync-service:
  enabled: false
postgresql-sync:
  enabled: false
alfresco-ai-transformer:
  enabled: false
alfresco-connector-ms365:
  enabled: false
alfresco-connector-msteams:
  enabled: false
alfresco-audit-storage:
  enabled: false
postgresql:
  primary:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 2Gi
    persistence:
      storageClass: longhorn
      baseSize: 8Gi
elasticsearch:
  elasticsearch:
    persistence:
      storageClass: longhorn
      baseSize: 8Gi
